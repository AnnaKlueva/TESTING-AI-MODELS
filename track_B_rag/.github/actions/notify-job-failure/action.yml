name: Notify job failure by email
description: Email repository owner and PR creator when a CI job fails

inputs:
  job-name:
    description: Display name of the failed job
    required: true
  owner-email:
    description: Repository owner notification email (GitHub secret NOTIFY_OWNER_EMAIL)
    required: false
    default: ""
  pr-author-email:
    description: PR author email override (GitHub secret NOTIFY_PR_AUTHOR_EMAIL)
    required: false
    default: ""
  smtp-server:
    description: SMTP server hostname
    required: true
  smtp-port:
    description: SMTP server port
    required: true
  smtp-username:
    description: SMTP username
    required: true
  smtp-password:
    description: SMTP password
    required: true
  from-email:
    description: Sender address (defaults to smtp-username)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve email recipients
      id: recipients
      uses: actions/github-script@v7
      with:
        script: |
          const recipients = new Set();

          const add = (email) => {
            const trimmed = (email || "").trim();
            if (trimmed) recipients.add(trimmed);
          };

          add(`${{ inputs.owner-email }}`);
          add(`${{ inputs.pr-author-email }}`);

          const ownerLogin = context.repo.owner;
          try {
            const { data: ownerUser } = await github.rest.users.getByUsername({
              username: ownerLogin,
            });
            add(ownerUser.email);
          } catch (error) {
            core.warning(`Could not fetch public email for owner @${ownerLogin}: ${error.message}`);
          }

          if (context.eventName === "pull_request") {
            const prLogin = context.payload.pull_request.user.login;
            try {
              const { data: prAuthor } = await github.rest.users.getByUsername({
                username: prLogin,
              });
              add(prAuthor.email);
            } catch (error) {
              core.warning(`Could not fetch public email for PR author @${prLogin}: ${error.message}`);
            }
          }

          const list = [...recipients];
          core.setOutput("recipients", list.join(","));
          core.setOutput("count", String(list.length));
          core.info(`Failure email recipients (${list.length}): ${list.join(", ") || "none"}`);

    - name: Send failure email
      if: steps.recipients.outputs.count != '0'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp-server }}
        server_port: ${{ inputs.smtp-port }}
        username: ${{ inputs.smtp-username }}
        password: ${{ inputs.smtp-password }}
        subject: "[CI failed] ${{ inputs.job-name }} — ${{ github.repository }}"
        to: ${{ steps.recipients.outputs.recipients }}
        from: ${{ inputs.from-email != '' && inputs.from-email || inputs.smtp-username }}
        body: |
          CI job failed

          Job:        ${{ inputs.job-name }}
          Workflow:   ${{ github.workflow }}
          Repository: ${{ github.repository }}
          Ref:        ${{ github.ref }}
          Event:      ${{ github.event_name }}
          Actor:      ${{ github.actor }}
          Run:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit:     ${{ github.sha }}

          Open the workflow run link above for logs and failure details.

    - name: No recipients configured
      if: steps.recipients.outputs.count == '0'
      shell: bash
      run: |
        echo "::warning::Job failed but no email recipients resolved. Add repository secrets NOTIFY_OWNER_EMAIL and/or NOTIFY_PR_AUTHOR_EMAIL (GitHub API public emails are rarely available)."
